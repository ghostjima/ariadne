name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The rules crate: format, lints on every feature set, tests. The release
  # test run is kept for the tests badge.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features wasm -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      # bash on every runner, so a failed test still fails the step through
      # the pipe.
      - name: cargo test --release (ariadne-rules)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rust-tests"
          cargo test --release --locked -p ariadne-rules 2>&1 | tee "$RUNNER_TEMP/rust-tests/rules-tests.txt"
      - run: cargo test --workspace --release --locked --no-default-features
      - run: cargo test --workspace --release --locked --all-features
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-tests
          path: ${{ runner.temp }}/rust-tests
          if-no-files-found: error
          retention-days: 7

  # The WebAssembly package of the rules crate, as the desk's worker loads it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Prebuilt binaries, checked against the SHA-256 sums in the action's
      # manifest; wasm-bindgen at the version Cargo.lock pins, so wasm-pack
      # uses it instead of fetching its own.
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack@0.13.1,wasm-bindgen@0.2.129
      - run: wasm-pack build crates/ariadne-rules --release --target web --out-dir pkg --out-name ariadne_rules -- --no-default-features --features wasm
      - run: ls -l crates/ariadne-rules/pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm
          path: crates/ariadne-rules/pkg
          if-no-files-found: error
          retention-days: 7

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85 --profile minimal && rustup target add wasm32-unknown-unknown --toolchain 1.85
      - run: cargo +1.85 check --workspace --all-targets --locked
      - run: cargo +1.85 check -p ariadne-rules --lib --no-default-features --features wasm --target wasm32-unknown-unknown --locked

  build-and-test:
    runs-on: ubuntu-latest
    # The apps link Stoa from a sibling checkout
    # (link:../../../stoa/packages/...), so this repository is checked out
    # into ariadne/ and Stoa into stoa/ beside it.
    defaults:
      run:
        working-directory: ariadne
    env:
      E2E_PORT: 4181
      LIGHTHOUSE_PORT: 4180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ariadne
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ghostjima/stoa
          ref: main
          path: stoa
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ariadne/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ariadne/pnpm-lock.yaml
            stoa/pnpm-lock.yaml
      - name: Stoa
        working-directory: stoa
        run: pnpm install --frozen-lockfile && pnpm build

      - run: pnpm install --frozen-lockfile
      # The packages first (the apps import their dist/), then the apps.
      - run: pnpm build
      - run: pnpm -r typecheck
      # Every measured output goes to $RUNNER_TEMP/app, which the badges
      # job reads.
      - name: Unit tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          pnpm test 2>&1 | tee "$RUNNER_TEMP/app/unit.log"
      - name: Chromium for the browser tests
        run: pnpm --filter @ariadne/desk exec playwright install --with-deps chromium
      # Each e2e builds its app and serves it with vite preview on E2E_PORT.
      - name: e2e, desk, against vite preview of the build
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/app/desk-e2e.json
        run: pnpm --filter @ariadne/desk e2e --reporter=list,json
      - name: e2e, agent, against vite preview of the build, Service Worker included
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/app/agent-e2e.json
        run: pnpm --filter @ariadne/agent e2e --reporter=list,json
      # Lighthouse 13 (a pinned dev dependency) in Playwright's Chromium,
      # accessibility, best practices and SEO only: performance on a shared
      # runner measures the runner. Each app's build is served by vite
      # preview (the agent's with its built Service Worker), measured, and
      # its server stopped; the build is kept for the bundle badge.
      - name: Lighthouse, desktop and mobile, against vite preview of each build
        shell: bash
        run: |
          CHROME_PATH="$(cd apps/desk && node -e "import('@playwright/test').then((m) => console.log(m.chromium.executablePath()))")"
          export CHROME_PATH
          for app in desk agent; do
            (cd "apps/$app" && exec node_modules/.bin/vite preview --host 127.0.0.1 --port "$LIGHTHOUSE_PORT" --strictPort) &
            server=$!
            for _ in $(seq 1 60); do
              curl -sf "http://127.0.0.1:$LIGHTHOUSE_PORT/" > /dev/null && break
              sleep 1
            done
            for form in desktop mobile; do
              preset=()
              if [ "$form" = desktop ]; then preset=(--preset=desktop); fi
              pnpm --dir "apps/$app" exec lighthouse "http://127.0.0.1:$LIGHTHOUSE_PORT/" "${preset[@]}" \
                --only-categories=accessibility,best-practices,seo \
                --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="$RUNNER_TEMP/app/lighthouse-$app-$form.json" --quiet
            done
            kill "$server"
            wait "$server" || true
            cp -R "apps/$app/dist" "$RUNNER_TEMP/app/$app-dist"
          done
      # On a pull request the commits since its base are checked; on a push,
      # the last commit, unless it is the first one, which has no parent.
      - name: House style (emoji, attribution, internal paths)
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=()
          if [ "$EVENT_NAME" = pull_request ]; then
            base=("origin/$BASE_REF")
          elif git rev-parse -q --verify HEAD~1 > /dev/null; then
            base=(HEAD~1)
          fi
          node scripts/check-text.mjs "${base[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app
          path: ${{ runner.temp }}/app
          if-no-files-found: error
          retention-days: 7

  # Builds the badges on every run, so a value that can no longer be read
  # fails on the pull request; only main publishes them.
  badges:
    needs: [rust, wasm, msrv, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Each artifact lands in a folder named after it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/measured
      - name: Badge values
        run: >-
          node scripts/badges.mjs --out "$RUNNER_TEMP/badges"
          --unit "$RUNNER_TEMP/measured/app/unit.log"
          --e2e "desk=$RUNNER_TEMP/measured/app/desk-e2e.json"
          --e2e "agent=$RUNNER_TEMP/measured/app/agent-e2e.json"
          --lighthouse "desk:desktop=$RUNNER_TEMP/measured/app/lighthouse-desk-desktop.json"
          --lighthouse "desk:mobile=$RUNNER_TEMP/measured/app/lighthouse-desk-mobile.json"
          --lighthouse "agent:desktop=$RUNNER_TEMP/measured/app/lighthouse-agent-desktop.json"
          --lighthouse "agent:mobile=$RUNNER_TEMP/measured/app/lighthouse-agent-mobile.json"
          --dist "desk=$RUNNER_TEMP/measured/app/desk-dist"
          --dist "agent=$RUNNER_TEMP/measured/app/agent-dist"
          --rules-tests "$RUNNER_TEMP/measured/rust-tests/rules-tests.txt"
          --rules-wasm "$RUNNER_TEMP/measured/wasm/ariadne_rules_bg.wasm"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: badges
          path: ${{ runner.temp }}/badges
          if-no-files-found: error
          retention-days: 7

  # Commits the badge JSON to the orphan branch `badges`, which the README's
  # img.shields.io/endpoint badges read. Only after a green run on main.
  publish-badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    steps:
      # This job pushes to the badges branch, so it keeps the credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: badges
          path: ${{ runner.temp }}/badges
      - name: Commit to the badges branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$RUNNER_TEMP/badges-branch"
          status=0
          git ls-remote --exit-code origin refs/heads/badges > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin badges
            git worktree add -B badges "$branch" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach "$branch"
            git -C "$branch" switch --orphan badges
          else
            exit "$status"
          fi
          find "$branch" -maxdepth 1 -name '*.json' -delete
          cp "$RUNNER_TEMP"/badges/*.json "$branch"/
          cd "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "The badges are unchanged."
            exit 0
          fi
          git commit -q -m "Badges measured on ${GITHUB_SHA}"
          git push origin HEAD:refs/heads/badges
